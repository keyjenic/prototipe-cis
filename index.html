<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype Revisi – Surya Sembada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Warna asli dari desain Figma (tidak diubah) ===== */
:root{
  --navy:#2F52A1; --navy-d:#243F82; --sky:#A8D8FA; --sky-l:#D6EDFD; --tint:#E3F1FB;
  --cyan:#38ACE1; --green:#B0D137; --red:#E3262B;
  --ink:#1D2433; --muted:#56637A; --line:#E2E8F0; --amber:#9A5B00;
  --fs:15px;
}
html.big{--fs:18.5px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:#EEF3F9;color:var(--ink);min-height:100vh;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
small{display:block;font-size:.84em;line-height:1.4}
b{font-weight:600}
.ic{flex-shrink:0;display:block}

/* ===== Ponsel ===== */
.phone{width:390px;height:844px;border-radius:44px;background:#fff;box-shadow:0 0 0 10px #1b2236,0 30px 60px rgba(20,40,90,.25);position:relative;overflow:hidden;font-size:var(--fs);flex-shrink:0;line-height:1.45}
.statusbar{position:absolute;top:0;left:0;right:0;height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:14px;font-weight:600;z-index:30;pointer-events:none;color:var(--ink)}
.statusbar{background:var(--sky)}
.statusbar.light{color:#fff;background:var(--navy)}
.statusbar.sb-cam{background:#1b2131}
#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.has-nav{padding-bottom:110px}
.screen.col{display:flex;flex-direction:column}
.screen.col>*{flex-shrink:0}
.in-r{animation:inR .32s cubic-bezier(.2,.8,.2,1);z-index:2}
.out-l{animation:outL .32s cubic-bezier(.2,.8,.2,1) forwards;z-index:1}
.in-l{animation:inL .32s cubic-bezier(.2,.8,.2,1);z-index:1}
.out-r{animation:outR .32s cubic-bezier(.2,.8,.2,1) forwards;z-index:2}
.fade{animation:fade .28s ease;z-index:2}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{to{transform:translateX(-28%);opacity:.5}}
@keyframes inL{from{transform:translateX(-28%);opacity:.5}to{transform:none;opacity:1}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,81,160,.35)}50%{box-shadow:0 0 0 7px rgba(47,81,160,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== Header & body ===== */
.hdr{background:var(--sky);padding:54px 16px 46px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:1.55em;font-weight:600;flex:1;line-height:1.2}
.hdr-r{display:flex;gap:4px}
.hdr.dark{background:transparent;color:#fff}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .12s;flex-shrink:0}
.iconbtn:hover{background:rgba(47,81,160,.08)}
.iconbtn:active{transform:scale(.9);background:rgba(47,81,160,.15)}
.body{background:#fff;border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:22px 20px 28px;flex:1}
.body>*{animation:rise .35s ease both}
.body>*:nth-child(2){animation-delay:.04s}.body>*:nth-child(3){animation-delay:.08s}.body>*:nth-child(4){animation-delay:.12s}.body>*:nth-child(n+5){animation-delay:.16s}
.mt{margin-top:14px}.mt2{margin-top:22px}
.muted{color:var(--muted)}
.center{text-align:center}
.red{color:var(--red)}
.sec-title{font-size:1.15em;font-weight:700;margin:24px 0 10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.link{color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.stack>*+*{margin-top:12px}

/* ===== Komponen ===== */
.btn{background:var(--navy);color:#fff;border-radius:12px;padding:.8em 1em;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s;box-shadow:0 4px 10px rgba(47,81,160,.25);text-align:center;min-height:48px}
.btn:hover{background:var(--navy-d)}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#B9C3D6;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--tint);color:var(--navy);box-shadow:none}
.btn.ghost:hover{background:#d3e7f8}
.btn.cyan{background:var(--cyan);box-shadow:0 4px 10px rgba(56,169,225,.3)}
.btn.outline{background:#fff;border:1.5px solid var(--navy);color:var(--navy);box-shadow:none}
.btn.outline:hover{background:var(--tint)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #F5C2C3;box-shadow:none}
.btn.big{min-height:56px;font-size:1.05em}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(30,60,120,.12);padding:16px;display:block;width:100%}
.tintcard{background:var(--tint);border-radius:14px;padding:14px}
.amt{font-size:1.9em;font-weight:700;color:var(--navy);line-height:1.2}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:600;padding:.28em .75em;border-radius:99px;font-style:normal;white-space:nowrap}
.b-red{background:#FDE7E7;color:#B91C1F}.b-ok{background:#E8F3D0;color:#4A6310}.b-amber{background:#FFF2DB;color:var(--amber)}.b-blue{background:var(--tint);color:var(--navy)}
.kv{border-top:1px solid var(--line)}
.kvr{display:flex;justify-content:space-between;gap:14px;padding:.55em 0;border-bottom:1px solid var(--line)}
.kvr>span:last-child{text-align:right}
.info{display:flex;gap:10px;align-items:flex-start;font-size:.88em;color:var(--navy)}
.field{margin-top:14px}
.field>label,.flabel{display:block;font-weight:500;margin-bottom:6px;font-size:.92em}
.input{width:100%;border:1.5px solid #C9D3E3;border-radius:10px;padding:.7em .9em;background:#fff;outline:none;transition:border .2s,box-shadow .2s;min-height:46px}
.input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(47,81,160,.18)}
textarea.input{resize:none;min-height:110px}
.hint{font-size:.82em;color:var(--muted);margin-top:4px}
.chip{border:1.5px solid #C9D3E3;border-radius:99px;padding:.4em .95em;font-weight:500;font-size:.88em;background:#fff;transition:.15s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(47,81,160,.2);border-top-color:var(--navy);width:44px;height:44px;border-width:4px}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ===== Nav bawah ===== */
.nav{position:absolute;left:16px;right:16px;bottom:18px;height:72px;background:var(--navy);border-radius:22px;display:flex;justify-content:space-around;align-items:center;z-index:20;box-shadow:0 8px 22px rgba(47,81,160,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.nav.hide{transform:translateY(150%)}
.nav button{color:#A9BCE3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74em;padding:6px 4px;border-radius:12px;min-width:72px;position:relative;transition:color .2s,transform .12s;text-align:center}
.nav button:active{transform:scale(.92)}
.nav button.on{color:#fff;font-weight:600}
.nav button.on::after{content:'';position:absolute;bottom:-5px;width:20px;height:3px;border-radius:2px;background:var(--green)}

/* ===== Toast / sheet ===== */
.toast{position:absolute;left:50%;bottom:108px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:.7em 1.1em;border-radius:12px;font-size:.88em;opacity:0;transition:.3s;z-index:70;display:flex;gap:8px;align-items:center;width:max-content;max-width:340px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;background:rgba(15,25,50,.45);z-index:50;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px 30px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:51;max-height:86%;overflow:auto}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#D5DCE8;margin:0 auto 14px}
.sh-t{font-size:1.15em;font-weight:700;margin-bottom:12px}
.sheet .opt+.opt{margin-top:10px}

/* ===== Login ===== */
.login{min-height:100%;display:flex;flex-direction:column}
.wave{display:block;width:100%;height:150px}
.login .logo-wrap{display:flex;justify-content:center;margin:18px 0 10px}
.login h2{color:var(--navy);text-align:center;font-size:1.45em;font-weight:700;letter-spacing:.5px}
.login .sub{text-align:center;color:var(--navy);font-size:.95em}
.lpanel{background:var(--navy);color:#fff;border-radius:28px 28px 0 0;padding:24px 24px 30px;margin-top:22px;flex:1}
.lpanel .input{border-color:transparent;color:var(--ink)}
.lpanel .field>label{color:#fff}
.lpanel .link{color:#9ED8F7}
.pw{position:relative}
.pw .input{padding-right:48px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.textsize-q{position:absolute;top:46px;right:14px;z-index:5;background:rgba(255,255,255,.92);color:var(--navy);border-radius:99px;padding:.35em .8em;font-size:.8em;font-weight:600;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ===== Beranda ===== */
.home{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-l) 45%,#fff 80%);min-height:100%;padding:48px 18px 20px}
.home>*{animation:rise .4s ease both}
.home-top{display:flex;justify-content:space-between;align-items:center}
.top-acts{display:flex;gap:2px}
.tbtn{display:flex;flex-direction:column;align-items:center;font-size:.66em;font-weight:600;color:var(--ink);padding:4px 6px;border-radius:10px;position:relative;min-width:50px;gap:2px;text-align:center}
.tbtn:active{background:rgba(255,255,255,.6)}
.dot-badge{position:absolute;top:0;right:8px;background:var(--red);color:#fff;font-style:normal;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--sky)}
.hello{font-size:1.2em;font-weight:600;margin:18px 2px 10px}
.idchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border:1.5px solid rgba(47,81,160,.25);border-radius:12px;padding:.5em .8em;color:var(--navy);width:100%;transition:.15s;text-align:left}
.idchip:hover{background:#fff}
.idchip span{flex:1;line-height:1.25}
.idchip small{color:var(--muted);font-size:.74em}
.billcard{margin-top:12px}
.billcard .row2{margin-top:14px}
.alert{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--red);text-align:left;transition:transform .12s}
.alert:active{transform:scale(.98)}
.alert span{flex:1}
.alert b{color:var(--navy);display:block;line-height:1.3}
.alert small{color:var(--muted)}
.alert.amber{color:#D38200}.alert.ok{color:#6F8F17}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 4px}
.mitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.76em;font-weight:600;color:var(--navy);padding:8px 2px;border-radius:12px;transition:background .15s;line-height:1.25}
.mitem:hover{background:var(--tint)}
.mitem .circ{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.mitem:hover .circ{transform:translateY(-3px)}
.mitem:active .circ{transform:scale(.9)}
.menu-card{margin-top:12px}

/* ===== Riwayat ===== */
.hrow{display:flex;gap:12px;align-items:stretch}
.hrow .rail{width:14px;display:flex;flex-direction:column;align-items:center}
.hrow .rail i{width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:16px}
.hrow .rail::after{content:'';flex:1;width:2px;background:#D9E7B0}
.hrow:last-child .rail::after{display:none}
.hrow-main{flex:1;display:flex;justify-content:space-between;gap:10px;padding:.65em .4em;border-bottom:1px solid var(--line);align-items:center;border-radius:8px;transition:background .15s;text-align:left}
.hrow-main:hover{background:var(--tint)}
.hrow-main b{font-size:1.02em}
.hrow-main .v{font-weight:600;white-space:nowrap}

/* ===== Pembayaran ===== */
.opt{border:1.5px solid transparent;border-radius:14px;background:var(--tint);transition:border .2s,background .2s,box-shadow .2s;color:var(--navy);display:block;width:100%}
.opt.sel{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(47,81,160,.12)}
.opt-main,button.opt{display:flex;gap:12px;align-items:center;width:100%;padding:14px;text-align:left}
.opt-ic{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex-shrink:0;color:var(--navy)}
.opt.sel .opt-ic{background:var(--tint)}
.opt-t{flex:1;line-height:1.3}
.opt-t b{font-size:1.05em;margin-right:6px}
.opt-t small{color:var(--muted);margin-top:2px}
.opt-t .fee{color:var(--navy);font-weight:600}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #9FB0CC;flex-shrink:0;position:relative;transition:.2s}
.sel .radio{border-color:var(--navy)}
.sel .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--navy);animation:pop .25s}
.subs{padding:0 14px 14px 72px;display:flex;flex-wrap:wrap;gap:8px;animation:rise .25s}
.paybar{position:sticky;bottom:0;background:#fff;padding:14px 0 4px;margin-top:22px;display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);z-index:3}
.paybar>div{flex:1;line-height:1.25}
.paybar b{font-size:1.2em;color:var(--navy)}
.paybar .btn{width:auto;flex:1.1}
.qrbox{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(30,60,120,.14);padding:18px;text-align:center}
.qrbox .qrlabel{display:inline-block;font-weight:700;letter-spacing:2px;color:var(--ink);border:2px solid var(--ink);padding:0 8px;border-radius:6px;margin-bottom:8px}
.qrbox svg{margin:6px auto;display:block}
.count{display:inline-flex;gap:6px;align-items:center;background:#FFF2DB;color:var(--amber);font-weight:600;padding:.35em .9em;border-radius:99px;font-size:.88em}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;display:block;position:relative;padding:.35em 0 .35em 36px;font-size:.92em}
.steps li::before{content:counter(s);position:absolute;left:0;top:.35em;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8em;font-weight:700;display:grid;place-items:center}
.va{display:flex;align-items:center;justify-content:space-between;background:var(--tint);border-radius:14px;padding:14px 16px}
.va b{font-size:1.35em;letter-spacing:1px;color:var(--navy)}
details.acc{border:1.5px solid var(--line);border-radius:12px;padding:0 14px;margin-top:10px}
details.acc summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary .ic{transform:rotate(180deg)}
details.acc summary .ic{transition:transform .2s}
details.acc ol,details.acc .dbody{padding:0 0 12px}
.okcirc{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:8px auto 14px;animation:pop .55s cubic-bezier(.2,1.4,.4,1);color:#fff;box-shadow:0 0 0 10px rgba(163,201,58,.2)}
.okcirc.blue{background:var(--navy);box-shadow:0 0 0 10px rgba(47,81,160,.15)}
.okcirc path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .35s forwards}
.wallet-logo{width:72px;height:72px;border-radius:20px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 10px;font-size:1.05em}
.proses{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}

/* ===== Catat meter ===== */
.bigopt{background:var(--tint);border-radius:14px;padding:16px 12px;display:flex;align-items:center;gap:12px;color:var(--navy);font-weight:600;transition:transform .12s,background .15s;text-align:left;line-height:1.2;font-size:1.02em}
.bigopt:hover{background:#d3e7f8}
.bigopt:active{transform:scale(.96)}
.alert-in{display:flex;gap:12px;align-items:center;color:var(--red)}
.alert-in b{display:block;line-height:1.3}
.alert-in small{color:var(--muted)}
.sched{display:flex;gap:12px;align-items:flex-start;color:var(--navy);border:1.5px dashed #A9C4E8;border-radius:14px;padding:12px 14px}
.sched small{color:var(--muted)}
.chart{margin:0;background:#fff}
.ch-line{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s .25s ease forwards}
.ch-v{font-size:12px;fill:#1D2433;font-weight:600}
.ch-x{font-size:12px;fill:#56637A}
.statuscard{display:flex;gap:12px;align-items:center;text-align:left}
.statuscard>span{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tl{list-style:none;padding-left:34px}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-24px;top:24px;bottom:2px;width:2px;background:var(--line)}
.tl-item.done::before{background:var(--green)}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:-34px;top:1px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #C9D3E3;display:grid;place-items:center;color:#fff}
.done .tl-dot{background:var(--green);border-color:var(--green)}
.cur .tl-dot{border-color:var(--navy);background:var(--navy);animation:pulse 1.6s infinite}
.tl-item b{display:block}
.tl-item small{color:var(--muted)}
.todo b{color:#8B97AB}
.cam{min-height:100%;background:radial-gradient(circle at 50% 40%,#3b4558,#0f1420);color:#fff;display:flex;flex-direction:column}
.viewfinder{position:relative;margin:4px 24px 0;height:400px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#5b6577,#2a3242);display:grid;place-items:center}
.viewfinder .meter-svg{width:250px;transform:rotate(-4deg);filter:brightness(.92)}
.frame{position:absolute;inset:70px 32px;transition:.3s}
.frame i{position:absolute;width:34px;height:34px;border:4px solid #fff;transition:border-color .3s}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.frame.ok i{border-color:var(--green)}
.scanline{position:absolute;left:40px;right:40px;height:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);top:80px;animation:scan 1.8s ease-in-out infinite alternate}
.frame.ok~.scanline{display:none}
@keyframes scan{to{top:320px}}
.cam-hint{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 24px 0;font-size:.9em;background:rgba(255,255,255,.12);padding:.6em 1em;border-radius:99px;transition:.3s}
.cam-hint.ok{background:rgba(163,201,58,.25);color:#E1F2B5}
.cam-bottom{display:flex;justify-content:space-around;align-items:center;margin-top:auto;padding:20px 20px 40px}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.3);transition:transform .12s}
.shutter:active{transform:scale(.88)}
.camside{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8em;cursor:pointer;min-width:60px}
.flashfx{position:absolute;inset:0;background:#fff;z-index:40;animation:flash .35s forwards;pointer-events:none}
@keyframes flash{from{opacity:1}to{opacity:0}}
.photo{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#5b6577,#2a3242);display:grid;place-items:center;height:220px}
.photo .meter-svg{width:190px;transform:rotate(-4deg)}
.photo img{width:100%;height:100%;object-fit:cover}
.checks{list-style:none}
.checks li{display:flex;gap:8px;align-items:center;padding:.25em 0;font-size:.92em;color:#4A6310}
.msg{font-size:.9em;border-radius:10px;padding:.6em .8em;margin-top:8px;display:none}
.msg.show{display:block;animation:rise .2s}
.msg.ok{background:#EEF6DC;color:#4A6310}.msg.warn{background:#FFF2DB;color:var(--amber)}.msg.err{background:#FDE7E7;color:#B91C1F}
.bigdigit{font-size:1.6em;font-weight:700;letter-spacing:3px;text-align:center}

/* ===== Pengaduan ===== */
.catcard{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:14px;background:var(--tint);color:var(--navy);text-align:left;transition:transform .12s,background .15s}
.catcard:hover{background:#d3e7f8}
.catcard:active{transform:scale(.98)}
.catcard .opt-ic{background:var(--navy);color:#fff}
.catcard small{color:var(--muted)}
.catcard span.t{flex:1;line-height:1.3}
.rowlink{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);margin-top:12px;color:var(--navy);text-align:left;transition:background .15s}
.rowlink:hover{background:var(--tint)}
.rowlink span{flex:1;line-height:1.3}
.rowlink small{color:var(--muted)}
.adu{text-align:left}
.adu .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{display:flex;gap:4px;margin-top:10px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--green)}
.prog-l{display:flex;justify-content:space-between;font-size:.7em;color:var(--muted);margin-top:4px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(160deg,#9db8d6,#56708f);display:grid;place-items:center;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.addthumb{width:84px;height:84px;border-radius:12px;border:2px dashed #A9C4E8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--navy);font-size:.75em;font-weight:600;cursor:pointer;background:#F6FAFE}
.contact{display:flex;gap:14px;align-items:center}
.contact .opt-ic{background:var(--tint)}
.contact span{flex:1;line-height:1.3}

/* ===== Chat ===== */
.chat{display:flex;flex-direction:column;padding-bottom:10px}
.aira-scope{display:flex;gap:10px;background:#FFF8E6;border:1px solid #F3DDA6;color:#5C4500;border-radius:14px;padding:12px;font-size:.88em}
.aira-scope small{font-size:.92em;margin-top:2px}
.aira-scope .link{color:var(--navy)}
.chatlog{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bub{max-width:86%;padding:.65em .9em;border-radius:16px;font-size:.92em;animation:rise .25s;line-height:1.45}
.bub .tm{font-size:.7em;opacity:.7;text-align:right;margin-top:2px;display:block}
.bub.bot{background:var(--green);color:#1D2433;border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--sky);align-self:flex-end;border-bottom-right-radius:4px}
.bub.menu{background:#fff;box-shadow:0 2px 12px rgba(30,60,120,.14);max-width:100%;align-self:stretch;padding:12px 14px}
.bub.menu button{display:flex;gap:8px;align-items:center;width:100%;padding:.55em 0;border-bottom:1px solid var(--line);color:var(--navy);font-weight:500;text-align:left}
.bub.menu button:last-child{border-bottom:0}
.bub .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bub .acts button{background:#fff;color:var(--navy);border-radius:99px;padding:.35em .85em;font-weight:600;font-size:.88em}
.typing{display:flex;gap:4px;padding:.8em 1em}
.typing i{width:7px;height:7px;border-radius:50%;background:#4A6310;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.chatbar{position:sticky;bottom:0;display:flex;gap:6px;align-items:center;padding:10px 12px 26px;background:#fff;border-top:1px solid var(--line);z-index:3}
.chatbar .input{border-radius:99px;min-height:44px}
.chatbar .send{color:var(--navy)}

/* ===== Notifikasi / profil / pengaturan ===== */
.nitem{display:flex;gap:12px;width:100%;padding:12px;border-radius:14px;text-align:left;transition:background .15s;position:relative;align-items:flex-start}
.nitem:hover{background:var(--tint)}
.nitem.unread{background:#F1F8FE}
.nitem .opt-ic{background:var(--tint);width:42px;height:42px}
.nitem span.t{flex:1;line-height:1.35}
.nitem small{color:var(--muted)}
.nitem .udot{width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:6px}
.avatar{width:112px;height:112px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:2.2em;font-weight:700;margin:-74px auto 8px;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--green);position:relative}
.pm{margin-top:16px}
.pm-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 12px;border-radius:12px;background:#fff;box-shadow:0 1px 8px rgba(30,60,120,.1);color:var(--navy);font-weight:500;margin-top:10px;transition:transform .12s;text-align:left}
.pm-row:active{transform:scale(.98)}
.pm-row span{flex:1;line-height:1.3}
.pm-row small{color:var(--muted);font-weight:400}
.pm-chev{width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center}
.pm-row.out{color:var(--red)}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:4px}
.seg button{flex:1;padding:.55em;border-radius:9px;font-weight:600;color:var(--muted);transition:.2s;text-align:center}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 6px rgba(30,60,120,.15)}
.setrow{display:flex;gap:12px;align-items:center;padding:.8em 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.setrow span{flex:1;line-height:1.3}
.setrow small{color:var(--muted)}
.sw{width:50px;height:30px;border-radius:99px;background:#C9D3E3;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--navy)}
.sw.on::after{left:23px}
.acccard{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;transition:border .2s}
.acccard.cur{border-color:var(--navy);background:#F6FAFE}
.acccard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acccard .acts{display:flex;gap:8px;margin-top:12px}
.acccard .acts .btn{min-height:40px;padding:.5em;font-size:.88em}
.gcard{border-left:5px solid var(--cyan)}
.gcard.hit{border-left-color:var(--red)}

/* ===== Logo ===== */
.logo{display:flex;align-items:center;gap:8px;line-height:1}
.logo .t1{font-size:7px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.logo .t2{white-space:nowrap;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px;margin:2px 0}
.logo .t3{font-size:6.5px;letter-spacing:2px;color:var(--ink)}
.logo.lg .t1{font-size:9px}.logo.lg .t2{font-size:21px}.logo.lg .t3{font-size:8.5px}

/* ===== Panel samping ===== */
.side{width:340px;font-size:14px;position:sticky;top:28px}
.side h1{font-size:22px;color:var(--navy)}
.side>p{color:var(--muted);margin:4px 0 16px}
.side h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 8px}
.jumps{display:flex;flex-wrap:wrap;gap:6px}
.jumps button{background:#fff;border:1px solid #D5DEEA;border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--navy);font-weight:500;transition:.15s}
.jumps button:hover{background:var(--navy);color:#fff}
.chg{list-style:none;background:#fff;border-radius:14px;padding:6px 14px;box-shadow:0 1px 6px rgba(30,60,120,.08)}
.chg li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;line-height:1.4;font-size:13px}
.chg li:last-child{border:0}
.chg li .ic{color:#6F8F17;margin-top:2px}
.swatch{display:flex;gap:6px;margin-top:8px}
.swatch i{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* =====================================================================
   VISUAL REFINEMENT v2 — palet CIS diperkaya, tipografi & komponen
   (hanya tampilan; fitur, isi, struktur & alur tidak berubah)
   ===================================================================== */
:root{
  --navy:#2F52A1; --navy-d:#223F84; --navy-2:#3E6AC2; --navy-l:#EDF2FB;
  --cyan:#38ACE1; --cyan-d:#1A78AE; --cyan-l:#E8F6FD;
  --green:#B0D137; --green-d:#5F7A12; --green-l:#F3F9E2;
  --sky:#BFE4F8; --sky-l:#E3F3FC; --tint:#EBF3FB;
  --amber-l:#FFF4E2; --amber:#94580A; --red-l:#FDEDED;
  --bg:#F4F8FC; --ink:#16213B; --muted:#56637C; --line:#E4EAF3;
  --sh:0 6px 18px rgba(31,62,128,.08),0 1px 3px rgba(31,62,128,.06);
  --sh-lg:0 14px 30px rgba(31,62,128,.16);
}
body{font-family:"Plus Jakarta Sans",Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#EAF3FB,#F3F8EC)}
.phone{letter-spacing:.005em}
.hdr h1,.amt,.sec-title,.hello,.login h2,.sh-t,.proses h2,.center>h1,.center>h2,.bigdigit,.wallet-logo,.avatar,.side h1,.va b,.paybar b{font-family:Poppins,"Plus Jakarta Sans",sans-serif}
b{font-weight:700}
small{color:inherit}
.muted{color:var(--muted)}
.screen{background:var(--bg)}
.statusbar{background:#C6E7F9}

/* --- Header halaman: gradasi lembut + ornamen --- */
.hdr{position:relative;overflow:hidden;background:linear-gradient(135deg,#CDEBFB 0%,#AEDDF6 55%,#C7E6B0 140%);padding:54px 16px 50px}
.hdr::before{content:'';position:absolute;right:-50px;top:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 68%);pointer-events:none}
.hdr::after{content:'';position:absolute;right:34px;bottom:26px;width:54px;height:54px;border-radius:50%;border:9px solid rgba(176,209,55,.28);pointer-events:none}
.hdr>*{position:relative;z-index:1}
.hdr h1{font-weight:700;font-size:1.48em;color:var(--navy-d);letter-spacing:-.015em}
.hdr .iconbtn{background:rgba(255,255,255,.7);color:var(--navy);box-shadow:0 2px 8px rgba(31,62,128,.1)}
.hdr .iconbtn:hover{background:#fff}
.hdr.dark{background:transparent}
.hdr.dark::before,.hdr.dark::after{display:none}
.hdr.dark h1{color:#fff}
.hdr.dark .iconbtn{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.body{background:var(--bg);border-radius:30px 30px 0 0;padding:24px 20px 30px}

/* --- Tipografi --- */
.sec-title{font-size:1.08em;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;letter-spacing:-.01em;margin:26px 0 12px}
.sec-title::before{content:'';width:4px;height:1.05em;border-radius:3px;background:linear-gradient(180deg,var(--cyan),var(--green));flex-shrink:0}
.amt{font-weight:700;letter-spacing:-.02em;color:var(--navy-d)}
.hint{color:var(--muted)}
.link{color:var(--cyan-d);text-decoration-thickness:1.5px;text-decoration-color:rgba(26,120,174,.35)}
.link:hover{text-decoration-color:currentColor}
.field>label,.flabel{font-weight:600;color:var(--ink);font-size:.9em}

/* --- Tombol --- */
.btn{background:linear-gradient(135deg,var(--navy-2),var(--navy));border-radius:14px;box-shadow:0 8px 16px rgba(47,82,161,.26);font-weight:700;letter-spacing:.01em}
.btn:hover{background:linear-gradient(135deg,#4775CC,var(--navy-d))}
.btn:disabled{background:#CBD3E1;color:#fff;box-shadow:none}
.btn.ghost{background:var(--navy-l);color:var(--navy);box-shadow:inset 0 0 0 1px rgba(47,82,161,.1)}
.btn.ghost:hover{background:#DFE8F8}
.btn.cyan{background:linear-gradient(135deg,#52C0EC,#2496CF);box-shadow:0 8px 16px rgba(56,172,225,.32)}
.btn.outline{background:#fff;border:1.5px solid #B9CCEB;color:var(--navy)}
.btn.outline:hover{background:var(--navy-l);border-color:var(--navy)}
.btn.danger{background:#fff;border-color:#F3C9CA}

/* --- Kartu & blok informasi --- */
.card{border-radius:20px;box-shadow:var(--sh);border:1px solid rgba(47,82,161,.05)}
.tintcard{background:linear-gradient(135deg,var(--cyan-l),var(--navy-l));border:1px solid #D9E9F8;border-radius:16px}
.tintcard.info,.info{color:#234A86}
.tintcard.info .ic,.info>.ic{color:var(--cyan-d)}
.kv{background:#fff;border:0;border-radius:18px;padding:2px 16px;box-shadow:var(--sh)}
.kvr{border-bottom:1px solid var(--line);padding:.62em 0}
.kv>.kvr:last-child{border-bottom:0}
.kvr>span:first-child{font-size:.92em}
.kvr>span:last-child{font-weight:500;color:var(--ink)}
.tintcard .kvr{border-bottom-color:rgba(47,82,161,.1)}
.badge{padding:.3em .8em;letter-spacing:.01em}
.b-red{background:var(--red-l);color:#B3201F}
.b-ok{background:#EAF4CF;color:#4C640C}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--cyan-l);color:#155F8A}
.input{border:1.5px solid #D3DDEB;border-radius:12px;background:#fff}
.input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(56,172,225,.18)}
.chip{border-color:#D3DDEB;background:#fff;color:var(--ink)}
.chip:hover{border-color:var(--cyan)}
.chip.on{background:linear-gradient(135deg,var(--navy-2),var(--navy));border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(47,82,161,.22)}

/* --- Nav bawah --- */
.nav{background:linear-gradient(135deg,#2F52A1,#3B66BD);border-radius:26px;height:74px;box-shadow:0 12px 26px rgba(47,82,161,.38),0 24px 0 16px var(--bg);padding:0 6px}
.nav button{color:#B4C6EA;border-radius:16px;padding:7px 6px;font-weight:500}
.nav button.on{background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.nav button.on::after{bottom:-7px;width:22px;background:var(--green)}

/* --- Login / daftar --- */
.login h2{color:var(--navy-d);letter-spacing:.02em}
.login .sub{color:var(--muted)}
.lpanel{background:linear-gradient(160deg,#3561B4 0%,#2F52A1 45%,#26468F 100%);box-shadow:0 -10px 30px rgba(47,82,161,.2);position:relative;overflow:hidden}
.lpanel::before{content:'';position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(176,209,55,.12);pointer-events:none}
.lpanel>*{position:relative}
.lpanel .link{color:#BFE6FA}

/* --- Beranda --- */
.home{background:radial-gradient(circle at 92% 2%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 30%),linear-gradient(180deg,#BDE4F8 0%,#DDF0FB 34%,var(--bg) 58%)}
.hello{font-size:1.32em;font-weight:700;color:var(--navy-d);letter-spacing:-.015em}
.tbtn{color:var(--navy-d);font-weight:700}
.tbtn>.ic{width:38px;height:38px;padding:8px;border-radius:13px;background:rgba(255,255,255,.75);color:var(--navy);box-shadow:0 2px 8px rgba(31,62,128,.1)}
.dot-badge{top:-3px;right:4px;border-color:#fff}
.idchip{background:#fff;border:0;box-shadow:var(--sh);border-radius:16px;padding:.6em .9em}
.idchip>.ic:first-child{color:var(--cyan-d)}
.idchip b{color:var(--navy-d)}
.billcard{position:relative;overflow:hidden;background:linear-gradient(135deg,#2F52A1 0%,#3767BF 62%,#38ACE1 135%);color:#fff;border:0;box-shadow:0 14px 28px rgba(47,82,161,.34)}
.billcard::before{content:'';position:absolute;right:-36px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.billcard::after{content:'';position:absolute;left:-30px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(176,209,55,.16);pointer-events:none}
.billcard>*{position:relative;z-index:1}
.billcard .muted{color:rgba(255,255,255,.82);font-weight:500}
.billcard .amt{color:#fff;font-size:2.15em}
.billcard .b-red{background:#fff;color:#B3201F}
.billcard .b-ok{background:var(--green);color:#22300A}
.billcard .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.billcard .btn.ghost:hover{background:rgba(255,255,255,.22)}
.billcard .btn:not(.ghost){background:var(--green);color:#1E2B05;box-shadow:0 6px 14px rgba(0,0,0,.16)}
.billcard .btn:not(.ghost):hover{background:#BEDB4F}
.alert{border-radius:18px}
.alert>.ic:first-child{width:46px;height:46px;padding:9px;border-radius:14px;background:var(--red-l)}
.alert.amber>.ic:first-child{background:var(--amber-l)}
.alert.ok>.ic:first-child{background:var(--green-l)}
.alert.ok{color:var(--green-d)}
.alert>.ic:last-child{color:#9AA7BD}
.alert b{color:var(--ink)}
.menu-card{padding:18px 12px}
.mitem{color:var(--ink);font-weight:600}
.mitem .circ{width:56px;height:56px;border-radius:18px;background:var(--navy-l);color:var(--navy);box-shadow:inset 0 0 0 1px rgba(47,82,161,.06)}
/* variasi warna ikon (berulang tiap 6) */
.grid3>.mitem:nth-child(6n+1) .circ,.stack>.catcard:nth-child(6n+1) .opt-ic,.stack>.contact:nth-child(4n+1) .opt-ic{background:var(--cyan-l);color:var(--cyan-d)}
.grid3>.mitem:nth-child(6n+2) .circ,.stack>.catcard:nth-child(6n+2) .opt-ic,.stack>.contact:nth-child(4n+2) .opt-ic{background:var(--green-l);color:var(--green-d)}
.grid3>.mitem:nth-child(6n+3) .circ,.stack>.catcard:nth-child(6n+3) .opt-ic,.stack>.contact:nth-child(4n+3) .opt-ic{background:var(--navy-l);color:var(--navy)}
.grid3>.mitem:nth-child(6n+4) .circ,.stack>.catcard:nth-child(6n+4) .opt-ic,.stack>.contact:nth-child(4n+4) .opt-ic{background:var(--amber-l);color:#B86A0C}
.grid3>.mitem:nth-child(6n+5) .circ,.stack>.catcard:nth-child(6n+5) .opt-ic{background:var(--red-l);color:#C8312F}
.grid3>.mitem:nth-child(6n+6) .circ,.stack>.catcard:nth-child(6n+6) .opt-ic{background:#EEF1F6;color:#4B5874}
.mitem:hover .circ{box-shadow:0 8px 16px rgba(31,62,128,.14)}

/* --- Riwayat --- */
.hrow .rail i{background:var(--green);box-shadow:0 0 0 4px var(--green-l)}
.hrow .rail::after{background:#DDEBB4}
.hrow-main{border-bottom-color:var(--line)}
.hrow-main:hover{background:#fff}
.hrow-main .v{color:var(--navy-d);font-family:Poppins,sans-serif}

/* --- Pembayaran --- */
.opt{background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:var(--sh);border-radius:18px}
.opt.sel{border-color:var(--cyan);background:linear-gradient(135deg,#fff 30%,var(--cyan-l));box-shadow:0 0 0 4px rgba(56,172,225,.16),var(--sh)}
.opt-ic{background:var(--navy-l);color:var(--navy);border-radius:14px}
.stack>.opt:nth-child(3n+1) .opt-ic{background:var(--cyan-l);color:var(--cyan-d)}
.stack>.opt:nth-child(3n+2) .opt-ic{background:var(--green-l);color:var(--green-d)}
.opt.sel .opt-ic{background:#fff}
.opt-t b{color:var(--navy-d)}
.opt-t .fee{color:var(--cyan-d)}
.sel .radio{border-color:var(--cyan-d)}
.sel .radio::after{background:var(--cyan-d)}
.radio{border-color:#B6C3D8}

function qrSVG(seed,size=210){const n=29;let r=seed%2147483647||7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;let s='';
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&rnd()<.47)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="Kode QR pembayaran"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><g fill="#1D2433">${s}${f(0,0)}${f(n-7,0)}${f(0,n-7)}</g></svg>`}

function chart(a){const rs=a.readings.slice(0,5).reverse(),vals=rs.map(r=>r.usage);const W=330,H=175,px=28,top=30,bot=30;
  const mn=Math.min(...vals)-2,mx=Math.max(...vals)+2;
  const xs=rs.map((_,i)=>px+i*(W-2*px)/(rs.length-1)),ys=vals.map(v=>top+(1-(v-mn)/(mx-mn))*(H-top-bot));
  let d=`M${xs[0]},${ys[0]}`;for(let i=1;i<xs.length;i++){const cx=(xs[i-1]+xs[i])/2;d+=` C${cx},${ys[i-1]} ${cx},${ys[i]} ${xs[i]},${ys[i]}`}
  const area=d+` L${xs[xs.length-1]},${H-bot} L${xs[0]},${H-bot} Z`;
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik pemakaian air: ${rs.map(r=>r.bulan+' '+r.usage+' meter kubik').join(', ')}"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38ACE1" stop-opacity=".45"/><stop offset="1" stop-color="#38ACE1" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g1)"/><path d="${d}" fill="none" stroke="#38ACE1" stroke-width="3" class="ch-line" pathLength="100"/>${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="5" fill="#B0D137" stroke="#fff" stroke-width="2"/><text x="${x}" y="${ys[i]-12}" text-anchor="middle" class="ch-v">${vals[i]} m³</text><text x="${x}" y="${H-8}" text-anchor="middle" class="ch-x">${rs[i].bulan.slice(0,3)}</text>`).join('')}</svg></figure>`}

/* ===== Router & animasi transisi ===== */
let stack=[],cur=null,timers=[];
function T(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function E(fn,ms){const t=setInterval(fn,ms);timers.push(t);return t}
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function topS(){return stack[stack.length-1]}
function render(dir='fwd'){
  clearTimers();closeSheet(true);
  const {name,p}=topS(),def=SC[name];
  const el=document.createElement('div');
  el.className='screen'+(def.nav?' has-nav':'')+(def.cls?' '+def.cls:'');
  el.innerHTML=def.html(p||{});
  const old=cur;
  if(old){
    if(dir==='fwd'){el.classList.add('in-r');old.classList.add('out-l')}
    else if(dir==='back'){el.classList.add('in-l');old.classList.add('out-r')}
    else el.classList.add('fade');
    setTimeout(()=>old.remove(),340);
  }
  $('#stage').appendChild(el);cur=el;
  const nav=$('#nav');nav.classList.toggle('hide',!def.nav);
  nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.go===def.nav);b.setAttribute('aria-current',b.dataset.go===def.nav?'page':'false')});
  $('#sbar').classList.toggle('light',!!def.dark);$('#sbar').classList.toggle('sb-cam',name==='scan');
  def.mount&&def.mount(el,p||{});
}
function refresh(){if(!cur)return;clearTimers();const {name,p}=topS(),def=SC[name],st=cur.scrollTop;cur.innerHTML=def.html(p||{});cur.querySelectorAll('.body>*,.home>*').forEach(e=>e.style.animation='none');cur.scrollTop=st;def.mount&&def.mount(cur,p||{})}
function go(name,p={},dir){const def=SC[name];
  if(def.nav){const fromTab=SC[topS()?.name]?.nav;stack=name==='home'?[{name,p}]:[{name:'home',p:{}},{name,p}];render(dir||(fromTab?'tab':'fwd'))}
  else{stack.push({name,p});render(dir||'fwd')}}
function replace(name,p={}){stack[stack.length-1]={name,p};render('fwd')}
function backTo(target){const i=stack.map(s=>s.name).lastIndexOf(target);if(i>=0){stack=stack.slice(0,i+1);render('back')}else go(target,{},'back')}

/* ===== PDF (dibuat langsung di browser, bisa dibuka di pembaca PDF mana pun) ===== */
function pdf(file,title,sub,rows,foot){
  const esc=s=>String(s).replace(/[–—]/g,'-').replace(/→/g,'->').replace(/³/g,'3').replace(/×/g,'x').replace(/·/g,'-').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1');
  const tx=(x,y,s,f,t,c='0.11 0.14 0.2')=>`BT ${c} rg /${f} ${s} Tf ${x} ${y} Td (${esc(t)}) Tj ET\n`;
  let c='0.184 0.318 0.627 rg 0 752 595 90 re f\n0.639 0.788 0.227 rg 0 746 595 6 re f\n';
  c+=tx(50,804,17,'F2','PERUMDA AIR MINUM SURYA SEMBADA','1 1 1')+tx(50,784,10,'F1','Kota Surabaya','1 1 1');
  c+=tx(50,708,16,'F2',title)+tx(50,688,10,'F1',sub,'0.34 0.39 0.48');
  let y=652;rows.forEach(([k,v,b])=>{if(k==='-'){c+=`0.85 0.88 0.92 RG 50 ${y+10} m 545 ${y+10} l S\n`;y-=10;return}c+=tx(50,y,11,b?'F2':'F1',k,'0.34 0.39 0.48')+tx(235,y,11,b?'F2':'F1',v);y-=22});
  c+=tx(50,y-16,9,'F1',foot,'0.34 0.39 0.48');
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',`<< /Length ${c.length} >>\nstream\n${c}endstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
  let out='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download=file;document.body.appendChild(a);a.click();a.remove();
  toast(`${I('download',18)} ${file} diunduh`);
}

  return `<button class="card alert ok" data-go="catat-status">${I('check',28)}<span><b>Meter Juni sudah terverifikasi</b><small>Stand ${num(n.stand)} m³ · pemakaian ${n.usage} m³</small></span>${I('chev',20)}</button>`}
SC.home={nav:'home',html(){const a=A(),b=a.bill,un=S.notif.filter(n=>!n.read).length,pt=b.paid&&findTrx(b.paid);
return `<div class="home">
<div class="home-top">${LOGO()}<div class="top-acts">

</div>`}};

/* --- Tagihan --- */

SC.tagihan={nav:'tagihan',html(){const a=A(),b=a.bill,t=billTotal(b),pt=b.paid&&findTrx(b.paid);
 const hist=S.trx.filter(x=>x.acc===a.id&&x.id!==b.paid).slice(0,3);
 return page('Tagihan',`${idChip()}
<div class="mt"><div class="muted">Tagihan ${b.bulan}</div><div class="amt">${rp(t)}</div>
${pt?`<span class="badge b-ok">${I('check',13)} Lunas · ${pt.tgl}</span>`:`<span class="badge b-red">Belum dibayar · jatuh tempo ${b.tempo}</span>`}
${pt?`<button class="btn mt" data-go="trx-detail" ${P({id:pt.id})}>${I('bill',20)} Lihat Bukti Bayar</button>`:`<button class="btn mt" data-act="startPay">Bayar Sekarang</button>`}</div>
<div class="kv mt2">
 ${kv('Pemakaian',`<b>${b.usage} m³</b>`)}${kv('Stand meter',`${num(b.awal)} → ${num(b.akhir)}`)}${kv('Periode pemakaian',b.periode)}
 ${kv(`Biaya air (${b.usage} m³ × ${rp(TARIF)})`,rp(b.usage*TARIF))}${kv('Biaya beban tetap',rp(BEBAN))}${kv('Denda',rp(b.denda))}
 ${kv('Tanggal jatuh tempo',b.tempo)}${kv('<b style="color:var(--ink)">Total tagihan</b>',`<b>${rp(t)}</b>`)}
</div>

<div class="tintcard mt info">${I('info',18)}<span>Bayar lewat <b>QRIS</b>, <b>E-Wallet</b> (GoPay, OVO, DANA, ShopeePay), atau <b>Transfer Bank</b>. Biaya admin selalu ditampilkan sebelum Anda membayar.</span></div>
<div class="sec-head"><h2 class="sec-title">Riwayat Pembayaran</h2><button class="link" data-go="riwayat-trx">Lihat semua</button></div>
<div>${hist.map(histRow).join('')||'<p class="muted">Belum ada riwayat.</p>'}</div>`)}};

/* --- Alur pembayaran: Metode → Konfirmasi → QRIS/E-Wallet/Bank → Proses → Berhasil --- */
const PAYOPT=[
 {m:'QRIS',ic:'qr',d:'Scan pakai aplikasi m-banking atau e-wallet apa pun',tag:'Paling mudah'},
 {m:'E-Wallet',ic:'wallet',d:'Langsung dibuka di aplikasi pilihan Anda',subs:['GoPay','OVO','DANA','ShopeePay']},
 {m:'Transfer Bank',ic:'bank',d:'Virtual Account lewat m-banking, ATM, atau teller',subs:['BCA','BRI','Mandiri','BNI']}];
const payOk=()=>{const p=S.pay,o=PAYOPT.find(x=>x.m===p.method);return !!o&&(!o.subs||!!p.sub)};
const payLabel=()=>S.pay.method+(S.pay.sub?' · '+S.pay.sub:'');
function billSummary(){const a=A(),b=a.bill;return `<div class="tintcard">${kv('ID Pelanggan',`${a.id} · ${a.label}`)}${kv('Nama',a.nama)}${kv('Tagihan',b.bulan)}<div class="kvr" style="border:0"><span class="muted">Jumlah tagihan</span><b>${rp(billTotal(b))}</b></div></div>`}
SC['bayar-metode']={html(){const p=S.pay,t=billTotal(A().bill),fee=p.method?FEE[p.method]:0;
 return page('Pilih Pembayaran',`${billSummary()}
<h2 class="sec-title">Metode pembayaran</h2>
<div class="stack" role="radiogroup" aria-label="Metode pembayaran">${PAYOPT.map(o=>`<div class="opt ${p.method===o.m?'sel':''}"><button class="opt-main" data-act="pickPay" data-m="${o.m}" role="radio" aria-checked="${p.method===o.m}">
<span class="opt-ic">${I(o.ic,26)}</span><span class="opt-t"><b>${o.m}</b>${o.tag?`<i class="badge b-ok">${o.tag}</i>`:''}<small>${o.d}</small><small class="fee">Biaya admin: ${FEE[o.m]?rp(FEE[o.m]):'Gratis'}</small></span><span class="radio"></span></button>
${o.subs&&p.method===o.m?`<div class="subs" role="radiogroup" aria-label="Pilih ${o.m}">${o.subs.map(s=>`<button class="chip ${p.sub===s?'on':''}" data-act="pickSub" data-s="${s}" role="radio" aria-checked="${p.sub===s}">${s}</button>`).join('')}</div>`:''}</div>`).join('')}</div>
${p.method&&!payOk()?`<p class="hint mt">Pilih ${p.method==='E-Wallet'?'e-wallet':'bank'} yang ingin dipakai.</p>`:''}
<div class="paybar"><div><small class="muted">Total bayar${p.method?` (termasuk admin ${fee?rp(fee):'Rp 0'})`:''}</small><b>${rp(t+fee)}</b></div><button class="btn" data-go="bayar-konfirmasi" ${payOk()?'':'disabled'}>Lanjutkan</button></div>`)}};
SC['bayar-konfirmasi']={html(){const a=A(),b=a.bill,t=billTotal(b),fee=FEE[S.pay.method];
 return page('Konfirmasi',`<p class="muted">Periksa kembali sebelum membayar.</p>
<div class="kv mt">${kv('ID Pelanggan',`${a.id} · ${a.label}`)}${kv('Nama pelanggan',a.nama)}${kv('Alamat',a.alamat)}${kv('Tagihan bulan',b.bulan)}${kv('Pemakaian',`${b.usage} m³`)}${kv('Metode',`<b>${payLabel()}</b>`)}</div>
<div class="tintcard mt2">${kv('Tagihan',rp(t))}${kv('Biaya admin',fee?rp(fee):'Gratis')}<div class="kvr" style="border:0"><b>Total bayar</b><b style="color:var(--navy);font-size:1.15em">${rp(t+fee)}</b></div></div>
<p class="info mt">${I('shield',18)}<span>Pembayaran diproses resmi atas nama Perumda Air Minum Surya Sembada. Status tagihan diperbarui otomatis setelah bayar.</span></p>
<button class="btn big mt2" data-act="confirmPay">Bayar ${rp(t+fee)}</button>
<button class="btn ghost mt" data-act="back">Ganti metode</button>`)}};
function countdown(el,sec){const f=()=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;el.textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(sec>0)sec--};f();E(f,1000)}
SC['bayar-qris']={html(){const a=A(),t=billTotal(a.bill)+FEE.QRIS;
 return page('Bayar dengan QRIS',`<div class="qrbox"><span class="qrlabel">QRIS</span><div class="muted small">PERUMDA AIR MINUM SURYA SEMBADA</div>${qrSVG(+a.id)}<div class="muted small">Total bayar</div><div class="amt">${rp(t)}</div>
<div class="mt"><span class="count">${I('clock',16)} Berlaku <span id="cd"></span></span></div></div>
<div class="row2 mt"><button class="btn ghost" data-act="saveQR">${I('download',18)} Simpan QR</button><button class="btn ghost" data-act="pdfBill">${I('bill',18)} Tagihan</button></div>
<h2 class="sec-title">Cara bayar</h2><ol class="steps"><li>Buka aplikasi m-banking atau e-wallet apa pun.</li><li>Pilih menu <b>Scan / QRIS</b>, lalu arahkan ke kode di atas. Atau unggah QR yang sudah disimpan.</li><li>Pastikan nama penerima <b>Surya Sembada</b> dan nominal ${rp(t)}, lalu bayar.</li></ol>
<button class="btn big mt2" data-act="paid">Saya Sudah Bayar</button>`)},mount(el){countdown($('#cd',el),14*60+59)}};
SC['bayar-ewallet']={html(){const a=A(),t=billTotal(a.bill)+FEE['E-Wallet'],w=S.pay.sub;
 return page('Bayar dengan '+w,`<div class="center"><div class="wallet-logo">${w}</div><p class="muted">Total bayar</p><div class="amt">${rp(t)}</div><p class="small muted mt">Termasuk biaya admin ${rp(FEE['E-Wallet'])}</p></div>
<h2 class="sec-title">Yang akan terjadi</h2><ol class="steps"><li>Aplikasi <b>${w}</b> terbuka otomatis.</li><li>Periksa nominal ${rp(t)}, lalu masukkan PIN ${w} Anda di aplikasi ${w}.</li><li>Anda kembali ke aplikasi ini dan status tagihan berubah menjadi <b>Lunas</b>.</li></ol>
<p class="info mt">${I('info',18)}<span>Pastikan saldo ${w} cukup. PIN tidak pernah diminta di aplikasi Surya Sembada.</span></p>
<button class="btn big mt2" data-act="openWallet">Buka ${w}</button><button class="btn ghost mt" data-act="back">Ganti metode</button>`)}};
const VAPRE={BCA:'39012',BRI:'88810',Mandiri:'89508',BNI:'98820'};
SC['bayar-bank']={html(){const a=A(),t=billTotal(a.bill)+FEE['Transfer Bank'],bk=S.pay.sub,va=(VAPRE[bk]+a.id).replace(/(\d{4})(?=\d)/g,'$1 ');
 return page('Transfer '+bk,`<div class="center"><p class="muted">Total bayar</p><div class="amt">${rp(t)}</div><p class="small muted">Termasuk biaya admin ${rp(FEE['Transfer Bank'])}</p><div class="mt"><span class="count">${I('clock',16)} Bayar dalam <span id="cd"></span></span></div></div>
<p class="flabel mt2">Nomor Virtual Account ${bk}</p><div class="va"><b>${va}</b><button class="btn ghost" style="width:auto;min-height:40px" data-act="copy" data-v="${va.replace(/ /g,'')}">${I('copy',18)} Salin</button></div>
<p class="hint">Atas nama: SURYA SEMBADA – ${a.nama}</p>
<details class="acc" open><summary>Lewat m-Banking ${bk} ${I('chevd',18)}</summary><ol class="steps"><li>Pilih <b>Transfer → Virtual Account</b>.</li><li>Masukkan nomor VA di atas.</li><li>Periksa nama dan nominal ${rp(t)}, lalu konfirmasi.</li></ol></details>
<details class="acc"><summary>Lewat ATM ${bk} ${I('chevd',18)}</summary><ol class="steps"><li>Pilih <b>Transaksi Lainnya → Transfer → Virtual Account</b>.</li><li>Masukkan nomor VA, lalu ikuti petunjuk di layar.</li></ol></details>
<button class="btn big mt2" data-act="paid">Cek Status Pembayaran</button>`)},mount(el){countdown($('#cd',el),23*3600+59*60+59)}};
SC['bayar-proses']={html:()=>`<div class="proses"><span class="spin dark"></span><h2>Memeriksa pembayaran…</h2><p class="muted">Mohon tunggu sebentar, jangan tutup aplikasi.</p></div>`,
 mount(){T(()=>{const id=doPay();replace('bayar-berhasil',{id})},1800)}};
function doPay(){const a=A(),b=a.bill,id='TRX-250605-'+(3000+Math.floor(Math.random()*900));
 const x={id,acc:a.id,bulan:b.bulan,tagihan:billTotal(b),admin:FEE[S.pay.method],metode:payLabel(),tgl:NOW};
 S.trx.unshift(x);b.paid=id;addNotif({type:'paid',title:'Pembayaran berhasil',body:`ID ${a.id} · Tagihan ${b.bulan} ${rp(x.tagihan+x.admin)} via ${S.pay.sub||S.pay.method}.`,go:'trx-detail',p:{id}});
 S.notif.forEach(n=>{if(n.type==='bill'&&n.body.includes(a.id))n.read=true});return id}
function receipt(x){const a=accById(x.acc);return `<div class="kv mt">${kv('No. transaksi',x.id)}${kv('Tanggal bayar',x.tgl)}${kv('ID Pelanggan',`${x.acc}${a?' · '+a.label:''}`)}${kv('Nama',a?a.nama:'-')}${kv('Tagihan bulan',x.bulan)}${kv('Metode',x.metode)}${kv('Tagihan',rp(x.tagihan))}${kv('Biaya admin',x.admin?rp(x.admin):'Gratis')}${kv('<b style="color:var(--ink)">Total dibayar</b>',`<b>${rp(x.tagihan+x.admin)}</b>`)}</div>`}
SC['bayar-berhasil']={backTo:'home',html({id}){const x=findTrx(id);
 return `<div style="padding:70px 20px 30px">${okCircle()}<h1 class="center" style="font-size:1.4em">Pembayaran Berhasil</h1><p class="center muted">Tagihan ${x.bulan} untuk ID ${x.acc} sudah lunas.</p><div class="center amt mt">${rp(x.tagihan+x.admin)}</div>
${receipt(x)}<button class="btn outline mt2" data-act="pdfTrx" data-id="${x.id}">${I('download',20)} Unduh Bukti (PDF)</button><button class="btn mt" data-act="home">Kembali ke Beranda</button></div>`}};
SC['trx-detail']={html({id}){const x=findTrx(id);
 return page('Detail Transaksi',`<div class="center"><span class="badge b-ok">${I('check',13)} Berhasil</span><div class="amt mt">${rp(x.tagihan+x.admin)}</div></div>${receipt(x)}<button class="btn outline mt2" data-act="pdfTrx" data-id="${x.id}">${I('download',20)} Unduh Bukti (PDF)</button><button class="btn ghost mt" data-go="hubungi">${I('phone',18)} Ada masalah? Hubungi petugas</button>`)}};
SC['riwayat-trx']={html(){const f=S.trxF,list=S.trx.filter(x=>f==='all'||x.acc===f);
 return page('Riwayat Transaksi',`<div class="chips" role="radiogroup" aria-label="Filter ID pelanggan"><button class="chip ${f==='all'?'on':''}" data-act="trxF" data-f="all">Semua ID</button>${S.accounts.map(a=>`<button class="chip ${f===a.id?'on':''}" data-act="trxF" data-f="${a.id}">${a.id} · ${a.label}</button>`).join('')}</div>
<div class="mt">${list.map(x=>`<button class="hrow-main" data-go="trx-detail" ${P({id:x.id})}><span><b>Tagihan ${x.bulan}</b><small class="muted">ID ${x.acc} · ${x.tgl}</small><small class="muted">${x.metode}</small></span><span class="v">${rp(x.tagihan+x.admin)}<br><span class="badge b-ok">Berhasil</span></span></button>`).join('')||'<p class="muted">Belum ada transaksi.</p>'}</div>`)}};

/* --- Catat meter --- */
SC.catat={nav:'catat',html(){const a=A(),n=a.now,last=n||a.readings[0];
 let st;
 if(!n)st=`<div class="tintcard alert-in">${I('bell',30)}<div><b>Anda belum mencatat meter bulan ini</b><small>Batas pencatatan 10 Jun 2025 · sisa 5 hari</small></div></div>
 <div class="row2 mt"><button class="bigopt" data-act="startScan">${I('camera',30)}<span>Scan<br>Meter</span></button><button class="bigopt" data-act="startManual">${I('pencil',30)}<span>Input<br>Manual</span></button></div>`;
 else st=`<button class="card statuscard" data-go="catat-status">${n.status==='ok'?`<span style="color:#6F8F17">${I('check',28)}</span>`:`<span style="color:#D38200">${I('clock',28)}</span>`}<span><b>Meter Juni 2025 sudah dikirim</b><small class="muted">Stand ${num(n.stand)} m³ · ${n.tgl}</small><div style="margin-top:6px">${stBadge(n.status)}</div></span>${I('chev',20)}</button>`;
 return page('Catat Meter',`${idChip()}<div class="mt">${st}</div>
<div class="sched mt">${I('calendar',22)}<div><b>Jadwal pencatatan</b><small>Setiap tanggal 1–10. Pengingat dikirim tanggal 1 dan 8. Foto diverifikasi petugas maks. 2×24 jam.</small></div></div>
<details class="acc"><summary><span style="display:flex;gap:8px;align-items:center">${I('bulb',20)} Tips foto agar cepat terverifikasi</span>${I('chevd',18)}</summary><ol class="steps"><li>Bersihkan kaca meter dari debu atau embun.</li><li>Foto tegak lurus dari depan, jangan miring.</li><li>Pastikan cahaya cukup. Nyalakan flash bila gelap.</li><li>Semua angka dan nomor seri meter harus terlihat jelas.</li><li>Jangan memakai foto lama atau foto yang diedit.</li></ol></details>
<p class="mt">Anda terakhir mencatat meter pada <b>${dOnly(last.tgl)}</b> (stand ${num(last.stand)} m³).</p>
<h2 class="sec-title">Pemakaian 5 bulan terakhir</h2>${chart(a)}
<h2 class="sec-title">Riwayat pencatatan</h2>
<div class="legend small"><span class="muted">Status foto:</span>${stBadge('pending')}${stBadge('ok')}${stBadge('rejected')}</div>
${[...(n?[n]:[]),...a.readings].map(r=>`<div class="kvr"><span><b>${r.bulan}</b><small class="muted">${dOnly(r.tgl)} · stand ${num(r.stand)} · ${r.usage} m³</small></span><span>${stBadge(r.status)}</span></div>`).join('')}`)}};
SC['catat-status']={backTo:'catat',html(){const a=A(),n=a.now;if(!n)return page('Status Catat Meter','<p>Belum ada pencatatan bulan ini.</p>');
 const ok=n.status==='ok';
 return page('Status Catat Meter',`<div class="center">${ok?okCircle():`<div class="okcirc blue">${I('clock',44)}</div>`}<h2>${ok?'Foto meter terverifikasi':'Menunggu verifikasi petugas'}</h2><p class="muted">ID ${a.id} · ${a.label} · Juni 2025</p></div>
<div class="photo mt">${METER(String(n.stand).padStart(5,'0'))}</div>
<div class="kv mt">${kv('Stand meter',`<b>${num(n.stand)} m³</b>`)}${kv('Pemakaian',`${n.usage} m³`)}${kv('Perkiraan tagihan Juli 2025',rp(n.usage*TARIF+BEBAN))}${kv('Cara catat',n.via)}${kv('Dikirim',n.tgl)}</div>
<h2 class="sec-title">Status verifikasi</h2>
${timeline([{t:'Foto terkirim',w:n.tgl,state:'done'},{t:ok?'Terverifikasi petugas':'Diverifikasi petugas',w:ok?'Angka sesuai dengan foto':'Maks. 2×24 jam sejak dikirim',state:ok?'done':'cur'},{t:'Masuk ke tagihan Juli 2025',w:'Tagihan terbit 1 Jul 2025',state:ok?'cur':'todo'}])}
<p class="info">${I('info',18)}<span>Jika foto ditolak, Anda akan mendapat notifikasi beserta alasannya dan bisa mengirim foto ulang.</span></p>`)}};
function prevStand(){return A().readings[0].stand}
function meterMsg(v){const prev=prevStand(),d=v-prev,avg=Math.round(A().readings.reduce((s,r)=>s+r.usage,0)/A().readings.length);
 if(isNaN(v))return {c:'',t:''};
 if(d<0)return {c:'err',t:`Angka lebih kecil dari catatan sebelumnya (${num(prev)}). Periksa kembali.`,bad:1};
 if(d>avg*2)return {c:'warn',t:`Pemakaian ${d} m³ jauh di atas rata-rata Anda (${avg} m³). Pastikan angka sudah benar.`};
 return {c:'ok',t:`Pemakaian bulan ini: <b>${d} m³</b> · perkiraan tagihan ${rp(d*TARIF+BEBAN)}`}}
SC.scan={cls:'',dark:true,html:()=>`<div class="cam">${hdr('Scan Meter',{dark:true,right:`<button class="iconbtn" data-act="flash" aria-label="Nyalakan flash" aria-pressed="false" style="color:#fff">${I('flash',22)}</button>`})}
<div class="viewfinder">${METER(String(prevStand()+10).padStart(5,'0'))}<div class="frame" id="frame"><i></i><i></i><i></i><i></i></div><div class="scanline"></div></div>
<p class="cam-hint" id="camHint" aria-live="polite">${I('clock',18)} Posisikan angka meter di dalam bingkai…</p>
<div class="cam-bottom"><button class="camside" data-act="tipsSheet">${I('bulb',26)}<span>Tips foto</span></button><button class="shutter" data-act="shoot" aria-label="Ambil foto"></button><label class="camside">${I('image',26)}<span>Galeri</span><input type="file" accept="image/*" hidden data-change="gallery"></label></div></div>`,
 mount(el){T(()=>{$('#frame',el).classList.add('ok');const h=$('#camHint',el);h.classList.add('ok');h.innerHTML=`${I('check',18)} Angka terbaca jelas. Silakan ambil foto.`},1600)}};
SC['scan-hasil']={html(){const v=prevStand()+10,m=meterMsg(v);
 return page('Periksa Hasil',`<div class="photo">${S.capture?`<img src="${S.capture}" alt="Foto meter dari galeri">`:METER(String(v).padStart(5,'0'))}</div>
<ul class="checks mt"><li>${I('check',18)} Angka terbaca</li><li>${I('check',18)} Cahaya cukup</li><li>${I('check',18)} Foto tidak miring</li></ul>
<div class="field"><label for="stand">Angka meter (dibaca otomatis, ubah jika salah)</label><input id="stand" class="input bigdigit" inputmode="numeric" value="${v}" data-input="stand"></div>
<p class="hint">Catatan sebelumnya: ${num(prevStand())} m³ (${A().readings[0].tgl})</p>

const REPLY={
 'Bayar Tagihan':{t:'Untuk membayar: buka menu <b>Tagihan → Bayar</b>, lalu pilih QRIS, E-Wallet, atau Transfer Bank. Biaya admin tampil sebelum Anda membayar.<br><br>AIRA tidak bisa melihat nominal tagihan Anda. Nominal ada di menu Tagihan.',a:[['Buka Tagihan','tagihan']]},

 'Hubungi Petugas':{t:'Petugas bisa dihubungi lewat Call Center 24 jam, WhatsApp, atau email. Untuk masalah akun dan tagihan, petugas bisa melihat data Anda.',a:[['Hubungi Petugas','hubungi']]},
};
const KEYS=[[/bayar|tagih|qris|wallet|transfer|lunas/i,'Bayar Tagihan'],[/meter|catat|stand|foto/i,'Catat Meter'],[/status|tiket|lacak/i,'Cek Status Pengaduan'],[/adu|lapor|keluh|bocor|keruh/i,'Buat Pengaduan'],[/gangguan|mati|tidak mengalir|pemeliharaan/i,'Info Gangguan Air'],[/petugas|telepon|cs|manusia|admin/i,'Hubungi Petugas']];
if(!S.chat.length)S.chat=[{from:'bot',t:`Halo ${S.user.panggil}, aku AIRA. Ada yang bisa aku bantu?`,tm:'09:41'},{from:'menu'}];
function msgHTML(m){if(m.from==='me')return `<div class="bub me">${m.t}<span class="tm">${m.tm} ✓✓</span></div>`;
 if(m.from==='menu')return `<div class="bub menu"><p class="small muted" style="margin-bottom:4px">Silakan pilih topik yang ingin ditanyakan:</p>${TOPICS.map(([ic,t])=>`<button data-act="chatTopic" data-t="${t}">${I(ic,18)} ${t}</button>`).join('')}</div>`;
 return `<div class="bub bot">${m.t}${m.a?`<div class="acts">${m.a.map(([l,g])=>`<button data-go="${g}">${l} →</button>`).join('')}</div>`:''}<span class="tm">${m.tm}</span></div>`}
function chatPush(m){S.chat.push(m);const log=$('#chatlog',cur);if(!log)return;log.insertAdjacentHTML('beforeend',msgHTML(m));cur.scrollTo({top:cur.scrollHeight,behavior:'smooth'})}
function chatAsk(q,topic){chatPush({from:'me',t:q,tm:'09:42'});const log=$('#chatlog',cur);log.insertAdjacentHTML('beforeend','<div class="bub bot typing" id="typing"><i></i><i></i><i></i></div>');cur.scrollTo({top:cur.scrollHeight,behavior:'smooth'});
 const k=topic||(KEYS.find(([r])=>r.test(q))||[])[1];
 T(()=>{$('#typing',cur)?.remove();if(k)chatPush({from:'bot',...REPLY[k],tm:'09:42'});else{chatPush({from:'bot',t:'Maaf, AIRA belum mengerti pertanyaan itu. Coba pilih salah satu topik, atau tanyakan langsung ke petugas.',a:[['Hubungi Petugas','hubungi']],tm:'09:42'});chatPush({from:'menu'})}},900)}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeSheet(true);go(g.dataset.go,g.dataset.p?JSON.parse(g.dataset.p):{});return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a,e)}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-input]');if(t)INP[t.dataset.input](t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');if(t)CHG[t.dataset.change](t)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-submit]');if(f){e.preventDefault();SUB[f.dataset.submit](f)}});

function exportShow(i){const [,,setup,after]=EXPORT[i];setup();render('none');if(after)after();clearTimers();
 document.querySelectorAll('.overlay,.sheet').forEach(e=>e.classList.add('show'))}
function exportParts(){const sh=document.querySelector('.sheet');if(sh)return 1;const max=cur.scrollHeight-cur.clientHeight,step=cur.clientHeight-(SC[topS().name].nav?300:200);return max<=4?1:1+Math.ceil(max/step)}
async function runExport(){
 document.body.classList.add('export');try{await Promise.all(['400','500','600','700','800'].map(w=>document.fonts.load(`${w} 16px "Plus Jakarta Sans"`)).concat(['500','600','700'].map(w=>document.fonts.load(`${w} 16px Poppins`))));await document.fonts.ready}catch(e){}const q=new URLSearchParams(location.hash.slice(1));
 if(q.get('export')==='list'){const snap=JSON.stringify(S),res=[];
  EXPORT.forEach((e,i)=>{Object.assign(S,JSON.parse(snap));document.documentElement.classList.remove('big');exportShow(i);res.push({i,id:e[0],title:e[1],parts:exportParts(),max:cur.scrollHeight-cur.clientHeight,nav:!!SC[topS().name].nav})});
  const pre=document.createElement('pre');pre.id='exportOut';pre.textContent=JSON.stringify(res);document.body.appendChild(pre);return}
 const i=+q.get('export'),k=+(q.get('part')||0);exportShow(i);
 cur.scrollTop=0;document.body.dataset.overflow=cur.scrollHeight-cur.clientHeight;
 if(k>0){const max=cur.scrollHeight-cur.clientHeight,step=cur.clientHeight-(SC[topS().name].nav?300:200);cur.scrollTop=Math.min(k*step,max)}
}
if(location.hash.startsWith('#export='))runExport();
else{stack=[{name:'login',p:{}}];render('none')}
